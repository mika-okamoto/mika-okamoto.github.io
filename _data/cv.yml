          - Developed counterfactual explanation methods that translate complex agentic-workflow behavior and errors into clear, actionable insights for developers through a visual, interactive interface (HCXAI at CHI 2026).
          - Led FLaME, the first holistic benchmark of LLMs over diverse financial analysis and reasoning tasks (ACL Findings 2025).

