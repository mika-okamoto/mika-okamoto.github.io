          - Created PACT, a multi-metric evaluation framework to assess whether enterprise AI assistants follow compliance rules in 48 realistic scenarios across regulated domains like healthcare, revealing no existing model is reliably safe (preprint under review).
          - Analyzed the psychology of why AI agents violate legal constraints under user pressure tactics, showing alignment between LLM behavior and prevailing human behavioral theories like deterrence and legitimacy (AIES 2026).

